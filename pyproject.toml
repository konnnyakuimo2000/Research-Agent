[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Konjac", email = "toshi_0301mm@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "openai>=3.31.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

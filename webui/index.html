<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research-Agent</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="app">
  <nav class="panetabs" id="paneTabs" role="tablist" aria-label="表示する画面">
    <button type="button" role="tab" data-pane="chat" aria-selected="true">チャット</button>
    <button type="button" role="tab" data-pane="tele" aria-selected="false">作業記録</button>
  </nav>
  <aside class="side" aria-label="調査の一覧">
    <div class="side-top">
      <span class="brand" aria-label="Research-Agent">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="12.5" cy="12.5" r="7.5"/>
          <path d="M18 18l4.5 4.5M22.5 22.5h5.5M22.5 22.5v5.5"/>
          <circle class="dot" cx="28" cy="22.5" r="2.2"/><circle class="dot" cx="22.5" cy="28" r="2.2"/>
        </svg>
        <span class="word">Research<span class="dash">-</span>Agent</span>
      </span>
      <button type="button" id="newBtn" class="pill">＋ 新しい調査</button>
    </div>
    <div class="runs" id="runs"></div>
    <div class="side-bottom">
      <button type="button" id="settingsBtn" class="setbtn" aria-haspopup="dialog" aria-controls="setPanel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 6.2l2.1 2.1M17.7 15.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 17.8l2.1-2.1M17.7 8.3l2.1-2.1"/></svg>
        <span>設定</span>
      </button>
    </div>
    <div class="split" id="splitSide" role="separator" aria-orientation="vertical" aria-label="履歴の幅" tabindex="0"></div>
  </aside>
  <div class="runmenu" id="runMenu" role="menu" hidden></div>

  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <section class="chatpane empty" id="chatpane" aria-label="チャット">
    <header class="chathead" id="chatHead">
      <button type="button" class="cbtn" id="runsBtn" aria-label="履歴" title="履歴を出す・隠す">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <button type="button" class="headsum" id="headSummary" aria-haspopup="dialog" aria-controls="setPanel" title="次の依頼の設定"></button>
      <span class="headctl" id="headCtl"></span>
      <p class="headwarn" id="headWarn" role="status" hidden></p>
    </header>
    <div class="chat" id="chat"></div>
    <div class="dock">
      <h1 class="hello">何を調べましょうか？</h1>
      <div class="examples" id="examples" aria-label="最近の依頼"></div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" autocomplete="off" placeholder="調べたいことを入力" aria-label="依頼"></textarea>
        <button type="submit" class="send" id="sendBtn" aria-label="送る" title="送る">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </form>
    </div>
    <div class="split" id="splitChat" role="separator" aria-orientation="vertical" aria-label="チャットの幅" tabindex="0"></div>
  </section>

  <section class="tele" aria-label="調査の作業記録">
    <div class="flow" id="flow">
      <div class="canvas" id="canvas" hidden><svg class="edges" id="edges"></svg></div>
      <div class="canvas graph" id="graph"><svg class="edges" id="gedges"></svg></div>
      <p class="flow-empty" id="flowEmpty">調査を始めると、ここに作業の流れが出ます。<br>ホイールで拡大、ドラッグで移動。</p>

      <div class="hud hud-top" role="group" aria-label="表示">
        <button type="button" data-view="flow" aria-pressed="true" title="工程別の流れ" aria-label="Flow（工程別の流れ）">Flow</button>
        <button type="button" data-view="tree" aria-pressed="false" title="判断ごとの履歴" aria-label="Tree（判断ごとの履歴）">Tree</button>
        <span class="mode" id="modeBadge" aria-live="polite"></span>
        <button type="button" class="runctl" id="runCtl" hidden></button>
      </div>
      <div class="hud hud-right" role="group" aria-label="表示の大きさ">
        <button type="button" id="zoomOut" aria-label="縮小">−</button>
        <button type="button" id="zoomFit" aria-pressed="true">全体</button>
        <button type="button" id="zoomIn" aria-label="拡大">＋</button>
      </div>
    </div>

    <aside class="drawer" id="drawer" aria-label="詳細">
      <header><h3 id="dTitle">詳細</h3><button type="button" id="dClose" aria-label="閉じる">✕</button></header>
      <div class="inner" id="dBody"></div>
    </aside>
  </section>
</div>
<div class="panel-scrim" id="panelScrim" hidden></div>
<aside class="setpanel" id="setPanel" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>
  <header><h2 id="setTitle" tabindex="-1">設定</h2><button type="button" id="setClose" aria-label="設定を閉じる">✕</button></header>
  <nav class="settabs" id="setTabs" role="tablist" aria-label="設定の種類"></nav>
  <div class="pbody" id="setBody"></div>
  <footer class="pfoot" id="setFoot" hidden></footer>
</aside>
<script type="module" src="/src/app.js"></script>
</body>
</html>

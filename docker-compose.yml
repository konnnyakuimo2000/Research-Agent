# Open WebUI + SearXNG + ゲートウェイ（画面）+ エージェント（調査・チャット）+ モデルの窓口
# 三層: webui（画面と記録）→ agent-*（調べ方）→ model-gateway（どのモデルに送るか）
# ゲートウェイとエージェントは契約（/agent/v1/*）だけで話す。エージェントを足すときは、ここにサービスを足し、
# config/agents.toml に 1 項目足す（docs/telemetry_enhancement_plan.md 3 章）
# 使い方: docker compose up -d   (停止: docker compose down)
# 接続先などの値は .env から読み込む（.env.example 参照）

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.3
    ports:
      - "127.0.0.1:3000:8080"   # この PC からのみ http://localhost:3000 で開ける
    volumes:
      - open-webui:/app/backend/data
    environment:
      # 利用者 ID とチャット ID をエージェントに渡す（同じ文面の会話を取り違えずに再開するため。レビュー 4）
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      # 接続先は 2 つ: LLM サーバー（普通の会話）と、ゲートウェイの OpenAI 互換の入口（モデル名 research-agent）
      # ※ Open WebUI は初回起動時だけこの値を使い、その後は管理画面（設定 → 接続）の値を使う
      OPENAI_API_BASE_URLS: "${VL_BASE_URL:?.env に VL_BASE_URL を設定してください};http://webui:8000/v1"
      OPENAI_API_KEYS: "${VL_API_KEY:-dummy};${AGENT_API_KEY:-dummy}"
      # 調査は数分かかるので、応答待ちで切らない（秒）
      AIOHTTP_CLIENT_TIMEOUT: "1800"
      # タイトル生成などの裏処理は、エージェントではなく LLM に直接させる
      TASK_MODEL_EXTERNAL: ${VL_MODEL:-qwen3.8-27b}
      ENABLE_OLLAMA_API: "false"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      WEB_SEARCH_RESULT_COUNT: "5"
    depends_on:
      - searxng
      - webui
    restart: unless-stopped

  # ゲートウェイ: テレメトリー画面（http://localhost:8100/ui/）、依頼の記録、OpenAI 互換の入口
  webui:
    build: .
    image: research-agent:local   # 3 つのサービスで同じイメージを使う（作るのはここだけ）
    ports:
      - "127.0.0.1:8100:8000"   # この PC からのみ開ける
    environment:
      VL_BASE_URL: ${VL_BASE_URL:?.env に VL_BASE_URL を設定してください}   # 設定の読み込みに要る（ゲートウェイは LLM を呼ばない）
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_SERVICE_KEY: ${AGENT_SERVICE_KEY:-}
      AGENT_UI_ORIGINS: ${AGENT_UI_ORIGINS:-}   # 画面を置くほかの出どころ（デスクトップアプリは足さなくてよい）
      AGENT_RESEARCH_URL: http://agent-research:8000
      AGENT_CHAT_URL: http://agent-chat:8000
      # モデルの一覧を読み、依頼ごとのモデルの選び直しを確かめる（役割に要る能力があるか）
      MODEL_GATEWAY_URL: http://model-gateway:8000/v1
      MODEL_GATEWAY_KEY: ${MODEL_GATEWAY_KEY:-}
    volumes:
      - ./runs:/app/runs        # 依頼の記録（一覧の SQLite とイベントの jsonl。git 管理外）
    networks:
      default:
        # 分ける前の接続先（http://agent:8000/v1）を覚えている Open WebUI からも、そのまま届くように
        aliases: [agent]
    depends_on:
      - agent-research
      - agent-chat
      - model-gateway
    restart: unless-stopped

  # 研究室で共有するときの HTTPS の入口（.claude/webui-framework-and-app-plan.md）。既定では起動しない:
  #   docker compose -p research-agent --profile lab up -d caddy
  # 証明書は Caddy の中の認証局が作る（tls internal）。使う PC には、その認証局の証明書を 1 回入れる（docs/setup.md）。
  # PWA（Service Worker・通知）は HTTPS でしか動かないため。ゲートウェイは、この入口からの API に鍵を求める
  caddy:
    image: caddy:2.10-alpine
    profiles: [lab]
    ports:
      - "443:443"
      - "80:80"                 # http:// で来たら https:// へ送る
    environment:
      LAB_HOST: ${LAB_HOST:-localhost}   # .env にこの PC の名前か IP アドレスを書く（未設定なら localhost だけ）
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # 認証局と証明書（作り直すと、各 PC に入れた証明書が使えなくなる）
    depends_on:
      - webui
    restart: unless-stopped

  # 調査エージェント（契約の 0・1 段と research/v1）。外には出さず、ゲートウェイからだけ呼ぶ。
  # モデルはモデルの窓口を通して呼ぶ（LLM の鍵は持たない）
  agent-research:
    image: research-agent:local
    command: ["/app/.venv/bin/uvicorn", "--factory", "research_agent.agents.research:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MODEL_GATEWAY_URL: http://model-gateway:8000/v1
      MODEL_GATEWAY_KEY: ${MODEL_GATEWAY_KEY:-}
      # 研究室の LLM の宛先は、公開ページの取得で拒むためだけに渡す（呼び出しは窓口を通す）
      VL_BASE_URL: ${VL_BASE_URL:?.env に VL_BASE_URL を設定してください}
      AGENT_SERVICE_KEY: ${AGENT_SERVICE_KEY:-}
      CINII_APPID: ${CINII_APPID:-}
      SEARXNG_URL: http://searxng:8080
    volumes:
      - ./runs/agent-research:/app/runs/agent-research   # 調べた状態の全体（調べ直すため）
    depends_on:
      - searxng
      - model-gateway
    restart: unless-stopped

  # チャット（契約の 0 段だけ）。Open WebUI の裏処理（タイトル生成など）も受け持つ
  agent-chat:
    image: research-agent:local
    command: ["/app/.venv/bin/uvicorn", "--factory", "research_agent.agents.chat:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MODEL_GATEWAY_URL: http://model-gateway:8000/v1
      MODEL_GATEWAY_KEY: ${MODEL_GATEWAY_KEY:-}
      VL_BASE_URL: ${VL_BASE_URL:?.env に VL_BASE_URL を設定してください}
      AGENT_SERVICE_KEY: ${AGENT_SERVICE_KEY:-}
    depends_on:
      - model-gateway
    restart: unless-stopped

  # モデルの窓口（第 3 層）。config/models.toml のモデルに送る。やり直し・モデルごとの同時実行の上限・使用量を
  # すべてのエージェントをまたいで受け持つ。LLM の接続先と鍵を持つのはここだけ
  model-gateway:
    image: research-agent:local
    command: ["/app/.venv/bin/uvicorn", "--factory", "research_agent.modelgw.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      VL_BASE_URL: ${VL_BASE_URL:?.env に VL_BASE_URL を設定してください}
      VL_MODEL: ${VL_MODEL:-qwen3.8-27b}
      VL_API_KEY: ${VL_API_KEY:-dummy}
      MODEL_GATEWAY_KEY: ${MODEL_GATEWAY_KEY:-}
      # Web API の鍵は、画面の 設定 › API キー で入れる（窓口だけが持つ。runs/.secrets/model_keys.json）
      MODEL_KEYS_FILE: /app/runs/.secrets/model_keys.json
      MODEL_CALL_LOG_DIR: /app/runs/llm_logs        # 調査ごとの LLM とのやり取り（送った全文と応答）
      MODEL_SPEND_FILE: /app/runs/model_spend.json   # 費用の記録（立ち上げ直しても今日の分を覚えておく）
    volumes:
      - ./runs:/app/runs
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.10.19-81371861f
    ports:
      - "127.0.0.1:8888:8080"   # 開発用: この PC のエージェントからのみ使う（外部には公開しない）
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?.env に SEARXNG_SECRET を設定してください}
    restart: unless-stopped

volumes:
  open-webui:
  caddy-data:

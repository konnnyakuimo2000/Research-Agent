# モデルの窓口（model-gateway）が使うモデルの一覧（docs/telemetry_enhancement_plan.md 6.2）。
# エージェントはモデルを直接呼ばず、窓口に頼む。モデルを足すときは、ここに 1 項目足す。
# 接続先・鍵・モデル名は .env から読む（*_env）。リポジトリには書かない。
#   provider         "openai" = OpenAI 互換（llama.cpp・Ollama・vLLM・OpenAI の Web API）、"anthropic" = Claude
#   capabilities     json_schema（JSON スキーマに沿った出力）・vision（画像を読める）
#   max_concurrency  このモデルに同時に送る数。すべてのエージェントをまたいで、窓口が守る
#   extra_body       モデルごとの癖（そのまま送る項目。Claude なら output_config = { effort = "low" } など）
#   price            100 万トークンあたりのドル（input_per_mtok・output_per_mtok。任意で cache_read_per_mtok）。
#                    書いたモデルは費用を数え、[limits] の上限で止める
#   external         依頼文や読んだページが外部の会社に送られる（anthropic は既定で true）。鍵がなければ「使えない」
#   drop_params      このモデルが受け付けない項目（OpenAI の新しいモデルの temperature など）

default = "lab-qwen"   # 既定のモデル（役割に書いていないとき、モデルを指定しないときに使う）

# 費用の上限（値段を書いたモデルの合計。ドル）。上限に達すると、値段のあるモデルへは送らずに断る。
# 研究室のモデル（値段なし）は止めない。消すと上限なし
[limits]
daily_usd = 5.0     # 1 日（この PC の日付）
run_usd = 1.0       # 1 つの調査

# 役割ごとの既定のモデル。エージェントは「どのモデルか」ではなく「どの役割か」で頼む（model = "role:<役割>"）。
# 依頼ごとに選び直すこともできる（画面・ゲートウェイから。能力が足りないモデルは選べない）
#   decide  判断（次に何をするか・依頼の確認・観点の分類・食い違い）   extract  ページ・検索結果の読み取り
#   vision  画像の確認（vision の能力が要る）                       report   報告を書く
#   chat    チャットのエージェント
[roles]
decide = "lab-qwen"
extract = "lab-qwen"
vision = "lab-qwen"
report = "lab-qwen"
chat = "lab-qwen"

[[models]]
id = "lab-qwen"
title = "研究室 qwen3.8-27b"
provider = "openai"
base_url_env = "VL_BASE_URL"
api_key_env = "VL_API_KEY"
model_env = "VL_MODEL"
model = "qwen3.8-27b"
capabilities = ["json_schema", "vision"]
max_concurrency = 2    # 研究室のサーバーは共有で同時に 4 件まで。こちらからは 2 件までにする
context_tokens = 32768
extra_body = { chat_template_kwargs = { enable_thinking = false } }   # 思考モード OFF（応答速度を優先）

# ---- Web API のモデル（鍵を .env に書くと使えるようになる。なければ一覧に「使えない」と出る）----
# 選ぶと、依頼文と読んだページの本文がその会社に送られる

[[models]]
id = "claude-opus"
title = "Claude Opus 5.5"
provider = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-opus-5-5"
capabilities = ["json_schema", "vision"]
max_concurrency = 4
context_tokens = 1000000
price = { input_per_mtok = 4.0, output_per_mtok = 20.0, cache_read_per_mtok = 0.20 }
fallbacks = "default"   # 安全のための判定で断られたとき、同じ呼び出しの中で別のモデルが答える（その分の費用は概算）

[[models]]
id = "claude-haiku"
title = "Claude Haiku 5.5"
provider = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-haiku-5-5"
capabilities = ["json_schema", "vision"]
max_concurrency = 4
context_tokens = 1000000
price = { input_per_mtok = 0.10, output_per_mtok = 0.50, cache_read_per_mtok = 0.01 }   # 入力 10 万トークンまでの値段


<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調査エージェント</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="調査の一覧">
    <div class="side-top">
      <span class="brand">調査エージェント</span>
      <button type="button" id="newBtn" class="pill">＋ 新しい調査</button>
    </div>
    <div class="runs" id="runs"></div>
  </aside>

  <section class="chatpane empty" id="chatpane" aria-label="チャット">
    <div class="chat" id="chat"></div>
    <div class="dock">
      <h1 class="hello">何を調べましょうか？</h1>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" autocomplete="off" placeholder="調べたいことを入力" aria-label="依頼"></textarea>
        <div class="crow">
          <button type="button" class="cbtn" id="plusBtn" aria-label="新しい調査" title="新しい調査">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <span class="cspace"></span>
          <span class="model" id="modelName" title="使っているモデル"></span>
          <button type="submit" class="send" id="sendBtn" aria-label="送る">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-send" d="M12 19V5M6 11l6-6 6 6"/><path class="i-pause" d="M9 6v12M15 6v12"/><path class="i-play" d="M8 5l11 7-11 7z"/></svg>
          </button>
        </div>
      </form>
      <div class="tray">
        <button type="button" class="tbtn" id="runsBtn" aria-label="調査の一覧" title="調査の一覧を出す・隠す">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <span class="cspace"></span>
        <span class="conn" id="conn" title="研究室の LLM サーバーと検索への接続">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 9.1 4.5 4.5 0 0 0 7 18z"/></svg>
          <span id="connText">確かめている</span>
        </span>
      </div>
    </div>
  </section>

  <section class="tele" aria-label="作業の流れ">
    <div class="flow" id="flow">
      <div class="canvas" id="canvas" hidden><svg class="edges" id="edges"></svg></div>
      <div class="canvas graph" id="graph"><svg class="edges" id="gedges"></svg></div>
      <p class="flow-empty" id="flowEmpty">調査を始めると、エージェントの作業の流れが、ここにノードと線で現れます。<br>ホイールやピンチで拡大、ドラッグで移動できます。</p>

      <div class="hud hud-top" role="group" aria-label="表示">
        <button type="button" data-view="flow" aria-pressed="true">流れ</button>
        <button type="button" data-view="tree" aria-pressed="false">木</button>
      </div>
      <div class="hud hud-right" role="group" aria-label="表示の大きさ">
        <button type="button" id="zoomOut" aria-label="縮小">−</button>
        <button type="button" id="zoomFit" aria-pressed="true">全体</button>
        <button type="button" id="zoomIn" aria-label="拡大">＋</button>
      </div>
    </div>

    <aside class="drawer" id="drawer" aria-label="詳細">
      <header><h3 id="dTitle">詳細</h3><button type="button" id="dClose" aria-label="閉じる">✕</button></header>
      <div class="inner" id="dBody"></div>
    </aside>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調査エージェント</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="調査の一覧">
    <div class="side-top">
      <span class="brand">調査エージェント</span>
      <button type="button" id="newBtn" class="pill">＋ 新しい調査</button>
    </div>
    <div class="runs" id="runs"></div>
  </aside>

  <section class="chatpane" aria-label="チャット">
    <div class="chat" id="chat">
      <div class="empty-chat" id="emptyChat">
        <h1>何を調べますか？</h1>
        <p>依頼を送ると、エージェントが調べている様子が右に木の形で伸びていきます。左の一覧から、これまでの調査を再生できます。</p>
      </div>
    </div>
    <form class="composer" id="composer">
      <input id="input" autocomplete="off" placeholder="調べたいことを入力">
      <button type="submit" id="sendBtn" aria-label="送る">↑</button>
    </form>
  </section>

  <section class="tele" aria-label="作業の流れ">
    <div class="flow" id="flow">
      <div class="canvas" id="canvas" hidden><svg class="edges" id="edges"></svg></div>
      <div class="canvas graph" id="graph"><svg class="edges" id="gedges"></svg></div>
      <p class="flow-empty" id="flowEmpty" hidden>調査を始めると、ここに作業の流れが木の形で伸びていきます。<br>ホイールやピンチで拡大、ドラッグで移動できます。</p>

      <div class="hud hud-top" role="group" aria-label="表示">
        <button type="button" data-view="flow" aria-pressed="true">流れ</button>
        <button type="button" data-view="tree" aria-pressed="false">木</button>
      </div>
      <div class="hud hud-left" id="replayCtl" hidden role="group" aria-label="再生">
        <button type="button" id="playBtn">一時停止</button>
        <button type="button" data-speed="8" aria-pressed="true">8×</button>
        <button type="button" data-speed="30" aria-pressed="false">30×</button>
        <button type="button" data-speed="0" aria-pressed="false">すぐ</button>
      </div>
      <div class="hud hud-right" role="group" aria-label="表示の大きさ">
        <button type="button" id="zoomOut" aria-label="縮小">−</button>
        <button type="button" id="zoomFit" aria-pressed="true">全体</button>
        <button type="button" id="zoomIn" aria-label="拡大">＋</button>
      </div>
    </div>

    <aside class="drawer" id="drawer" aria-label="詳細">
      <header><h3 id="dTitle">詳細</h3><button type="button" id="dClose" aria-label="閉じる">✕</button></header>
      <div class="inner" id="dBody"></div>
    </aside>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
